name: Publicar web

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-web
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Instalar Godot 4.7
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
          chmod +x godot

      - name: Exportar el pack web
        run: |
          S=$(git rev-parse --short=7 HEAD)
          echo "S=$S" >> "$GITHUB_ENV"
          ./godot --headless --import --path . || true
          ./godot --headless --path . --export-pack "Web" "site/$S-index.pck"
          test "$(stat -c %s "site/$S-index.pck")" -gt 1000000

      - name: Apuntar la web al pack nuevo
        working-directory: site
        run: |
          test "$(grep -c "'mainPack':" index.html)" = "1"
          sed -i -E "s/('mainPack': ')[^']*(')/\1$S-index.pck\2/" index.html
          grep -n "'mainPack':" index.html

      - name: Publicar en gh-pages
        working-directory: site
        run: |
          git config user.name "José Manuel Benítez Alba"
          git config user.email "147749584+JoseBenitezAlba@users.noreply.github.com"
          git add "$S-index.pck" index.html
          git commit -m "subo el pack $S y apunto la web a él"
          git push origin HEAD:gh-pages
